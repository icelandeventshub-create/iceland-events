name: Update Iceland events

on:
  schedule:
    - cron: "17 5 * * *"   # every day at 05:17 Reykjavik time (UTC)
  workflow_dispatch:        # adds a "Run workflow" button for manual runs

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python scrape_events.py

      - name: Commit updated feed
        run: |
          git config user.name "events-bot"
          git config user.email "events-bot@users.noreply.github.com"
          git add docs/events.json
          git diff --cached --quiet || git commit -m "Update events $(date -u +%F)"
          git push
