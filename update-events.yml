name: Update Iceland events

on:
  schedule:
    - cron: "17 5 * * *"   # every day at 05:17 Reykjavik time (UTC)
  workflow_dispatch:        # adds a "Run workflow" button for manual runs
  push:
    paths:
      - extra-events.txt      # update the site whenever you save your extra events

concurrency:
  group: update-events      # never run two updates at the same time
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Install the hidden browser (for KKÍ basketball pages)
        run: python -m playwright install --with-deps chromium
        continue-on-error: true   # if this fails, everything except basketball still updates

      - name: Collect events
        run: python scrape_events.py

      - name: Collect cinema showtimes
        run: python fetch_movies.py
        continue-on-error: true
        env:
          KVIKMYNDIR_API_KEY: ${{ secrets.KVIKMYNDIR_API_KEY }}

      - name: Commit updated feeds
        run: |
          git config user.name "events-bot"
          git config user.email "events-bot@users.noreply.github.com"
          git add docs/*.json
          git diff --cached --quiet || git commit -m "Update events $(date -u +%F)"
          git pull --rebase
          git push
